name: Build and check desktop image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      IMAGE: ghcr.io/jackhammer9/isaac-sim-runpod
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare disposable runner for large NVIDIA image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/share/powershell /usr/share/swift
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo systemctl stop docker
          echo '{"features":{"containerd-snapshotter":false}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h /
      - name: Build Linux image
        run: |
          docker build --platform linux/amd64 --label org.opencontainers.image.source=https://github.com/Jackhammer9/isaac-sim-runpod --label org.opencontainers.image.revision=${GITHUB_SHA} -t ${IMAGE}:${GITHUB_SHA} .
      - name: Validate scripts and actual desktop resizing
        run: |
          docker run --rm --entrypoint /bin/bash ${IMAGE}:${GITHUB_SHA} -n /opt/isaac-desktop/launch-isaac.sh
          docker run --rm --entrypoint /opt/selkies-env/bin/python3 ${IMAGE}:${GITHUB_SHA} /opt/isaac-desktop/check-desktop.py
      - name: Publish image
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push ${IMAGE}:${GITHUB_SHA}
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            docker tag ${IMAGE}:${GITHUB_SHA} ${IMAGE}:${GITHUB_REF_NAME}
            docker push ${IMAGE}:${GITHUB_REF_NAME}
          fi
          echo "Published ${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
